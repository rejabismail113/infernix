name: infernix-one

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: infernix-one/app:dev
  volumes:
    - .:/var/www/html
    - vendor:/var/www/html/vendor
    - node_modules:/var/www/html/node_modules
  env_file: .env
  environment:
    DB_HOST: postgres
    REDIS_HOST: redis
    AWS_ENDPOINT: http://objectstore:9000
    MAIL_HOST: mailpit
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    objectstore: { condition: service_healthy }
  networks: [infernix]

services:
  app:
    <<: *app
    ports: ["${APP_PORT:-8010}:8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/up"]
      interval: 15s
      timeout: 5s
      retries: 10

  horizon:
    <<: *app
    command: php artisan horizon
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 5s
      retries: 5

  scheduler:
    <<: *app
    command: php artisan schedule:work

  vite:
    image: node:22-bookworm
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    ports: ["5173:5173"]
    networks: [infernix]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: infernix
      POSTGRES_USER: infernix
      POSTGRES_PASSWORD: infernix
      TZ: Asia/Kuala_Lumpur
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infernix -d infernix"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [infernix]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [infernix]

  # S3-compatible private object store for the `documents` disk. MinIO's images were removed from Docker Hub,
  # so dev uses RustFS (Apache-2.0, S3 API). Pinned tag; override with OBJECTSTORE_IMAGE. The bucket is created by
  # `php artisan storage:ensure-bucket` (make setup), so no vendor CLI image is needed. See DECISIONS D-17.
  objectstore:
    image: ${OBJECTSTORE_IMAGE:-rustfs/rustfs:1.0.4}
    environment:
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-infernix}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-infernix-minio-secret}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes: [objectdata:/data]
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      infernix:
        aliases: [minio] # keeps older .env files (AWS_ENDPOINT=http://minio:9000) working

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]
    networks: [infernix]

volumes:
  pgdata:
  redisdata:
  objectdata:
  vendor:
  node_modules:

networks:
  infernix:
